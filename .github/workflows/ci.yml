name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo test --locked
      - name: Installer script syntax check
        run: bash -n docs/install.sh

  smoke:
    name: End-to-end MCP smoke (two identities)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo build
      - name: Set up two test identities
        run: scripts/mcp_smoke_setup.sh target/debug/agent-mail
      - name: Drive two MCP servers over stdio
        run: python3 scripts/mcp_smoke.py target/debug/agent-mail

  build:
    name: Build binaries
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: agent-mail-${{ matrix.os }}
          path: target/release/agent-mail*
          if-no-files-found: error
