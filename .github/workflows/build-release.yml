name: Production build

# Cutting a production binary: push to the `production` branch.
# Creates a versioned GitHub Release (tag v<VERSION>-prod.<N>) with
# tri-OS binaries and checksums. The latest non-prerelease release is
# what the docs site points people at.

on:
  push:
    branches: [production]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build binaries
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package binary
        shell: bash
        run: |
          VERSION="v$(grep '^version =' Cargo.toml | head -1 | cut -d'"' -f2)"
          TARGET=$(rustc -vV | sed -n 's/host: //p')
          mkdir -p dist
          EXT=""
          [[ "${{ matrix.os }}" == "windows-latest" ]] && EXT=".exe"
          cp "target/release/agent-mail$EXT" "dist/agent-mail-${VERSION}-${TARGET}$EXT"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - name: Create versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(grep '^version =' Cargo.toml | head -1 | cut -d'"' -f2)"
          TAG="${VERSION}-prod.${{ github.run_number }}"
          {
            echo "Production build of agent-mail **$VERSION** (build ${{ github.run_number }})."
            echo
            echo "- Commit: ${{ github.sha }}"
            echo "- Branch: \`production\`"
            echo "- Binaries for Linux, macOS, and Windows; verify with \`sha256sum -c SHA256SUMS\`."
            echo
            echo "Development (main-branch) builds are marked as prereleases."
          } > NOTES.md
          gh release create "$TAG" dist/* \
            --title "agent-mail $TAG" \
            --notes-file NOTES.md
